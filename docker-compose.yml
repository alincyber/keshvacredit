
services:

  backend:
    build: .
    container_name: backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - mongodb

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - backend

  mongodb:
    image: mongo:8

    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:


